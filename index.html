<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dango³🍡</title>
    <link rel="stylesheet" href="/style.css">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.2/css/all.css">
    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
  </head>
  <body>
    <div class="language-toggle">
      <label class="language-toggle-label">
        <input type="checkbox" id="language-checkbox" aria-label="Toggle language">
        <img class="language-toggle-icon" src="/images/language.svg" alt="">
      </label>
    </div>
    <div class="container">
      <!-- Logo -->
      <img src="/images/logo.webp">
      <!-- Social Icons -->
      <div class="social-icons">
        <a href="https://www.youtube.com/@DangoCubed" target="_blank" rel="noopener noreferrer" title="Youtube" class="blue-themed">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com/dangocubed" target="_blank" rel="noopener noreferrer" title="Instagram" class="red-themed">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@dangocubed" target="_blank" rel="noopener noreferrer" title="Tiktok" class="yellow-themed">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://x.com/DangoCubed" target="_blank" rel="noopener noreferrer" title="X (Twitter)" class="red-themed">
          <i class="fab fa-x-twitter"></i>
        </a>
        <a href="https://www.facebook.com/DangoCubed" target="_blank" rel="noopener noreferrer" title="Facebook" class="blue-themed">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.twitch.tv/dangocubed" target="_blank" rel="noopener noreferrer" title="Twitch" class="red-themed">
          <i class="fab fa-twitch"></i>
        </a>
        <a href="https://discord.dango-cubed.com" target="_blank" rel="noopener noreferrer" title="Discord" class="yellow-themed">
          <i class="fab fa-discord"></i>
        </a>
      </div>
      <div class="cards-grid">
        <!-- Video Embed Card-->
        <div class="card">
          <span class="card-title red-themed">What's Dango³ ?</span>
          <div class="card-wrapper red-themed">
            <iframe
              src="https://www.youtube-nocookie.com/embed/TO7hG09JGFQ"
              title="Dango Cubed Intro"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
              frameborder="0"
            ></iframe>
          </div>
        </div>
        <!-- Member Card -->
        <div class="card">
          <span class="card-title blue-themed">Meet the Dango!</span>
          <div class="card-wrapper member-wrapper blue-themed">
            <!-- Omu -->
            <div class="member">
              <img class="blue-themed" src="/images/member/omu-profile.webp">
              <span class="blue-themed">Omu</span>
              <small class="member-description">the Crybaby</small>
            </div>
            <!-- Momiji -->
            <div class="member">
              <img class="red-themed" src="/images/member/momiji-profile.webp">
              <span class="red-themed">Momiji</span>
              <small class="member-description">the Leader</small>
            </div>
            <!-- SAL -->
            <div class="member">
              <img class="yellow-themed" src="/images/member/sal-profile.webp">
              <span class="yellow-themed">Sal</span>
              <small class="member-description">the Asshole</small>
            </div>
          </div>
        </div>
        <!-- News Card -->
        <div class="card">
          <span class="card-title yellow-themed">News From Us!</span>
          <div class="card-wrapper yellow-themed">
            <div class="loop-gallery" data-source="/data/news.json">
              <button type="button" class="loop-arrow loop-arrow-left">&#10094;</button>
              <img class="loop-image is-active" alt="loop image 1">
              <img class="loop-image" alt="loop image 2">
              <button type="button" class="loop-arrow loop-arrow-right">&#10095;</button>
            </div>
          </div>
        </div>
        <!-- Contact Card -->
        <div class="card">
          <span class="card-title red-themed">Contact Us!</span>
          <div class="card-wrapper contact-wrapper red-themed">
            <form class="contact-form" id="contact-form">
              <div class="contact-field contact-subject">
                <label for="contact-subject">Subject:</label>
                <input id="contact-subject" name="subject" type="text" maxlength="150" required>
              </div>
              <div class="contact-field contact-message-field">
                <label for="contact-content">Message:</label>
                <textarea id="contact-content" name="content" maxlength="3000" required></textarea>
              </div>
              <button class="contact-send" type="submit">Send</button>
              <p class="contact-note">Contact us for business inquiries, or any other matter as you like!</p>
            </form>
          </div>
        </div>
      </div>
      <button class="back-to-top-button" type="button">
        <svg viewBox="0 0 64 32" aria-hidden="true" focusable="false">
          <path d="M8 26 32 6l24 20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Back to Top</span>
      </button>
      <footer>
        <span>
          Site made by
          <a href="https://nicotine.buzz" target="_blank" rel="noopener noreferrer">salmoooon</a>.
          <br>
          Gen AI was used only on the coding part of this site.
          <br>
          © 2026 Dango Cubed
        </span>
      </footer>
    </div>
    <script src="/script.js"></script>
  </body>
</html>
