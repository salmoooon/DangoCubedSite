<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Everything you need to know about the Dango³ group!">
    <meta name="theme-color" content="#FFC6BD">
    <meta name="color-scheme" content="light">
    <script>
      try {
        if (localStorage.getItem("language") === "tw") {
          document.documentElement.lang = "zh-Hant-TW";
        }
      } catch {}
    </script>
    <title>Dango³🍡</title>
    <link rel="stylesheet" href="/style.css">
    <!-- fontawesome -->
    <link rel="stylesheet" href="/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="/fontawesome/css/brands.css">
    <link rel="stylesheet" href="/fontawesome/css/solid.css">
    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Dango³">
    <meta property="og:description" content="Everything you need to know about the Dango³ group!">
    <meta property="og:image" content="https://dango-cubed.com/images/meta-image.jpg">
    <meta property="og:url" content="https://dango-cubed.com">
    <meta property="og:type" content="website">
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div class="language-toggle">
      <label class="language-toggle-label">
        <input type="checkbox" id="language-checkbox" data-i18n-aria-label="language_toggle">
        <img class="language-toggle-icon" src="/images/language.svg" alt="">
      </label>
    </div>
    <div class="container">
      <!-- Logo -->
      <img src="/images/logo.webp" alt="" data-i18n-alt="logo_alt">
      <div class="social-intro-group">
        <!-- Social Icons -->
        <div class="social-icons">
        <a href="https://www.youtube.com/@DangoCubed" target="_blank" rel="noopener noreferrer" data-i18n-title="social_youtube" class="blue-themed">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com/dangocubed" target="_blank" rel="noopener noreferrer" data-i18n-title="social_instagram" class="red-themed">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@dangocubed" target="_blank" rel="noopener noreferrer" data-i18n-title="social_tiktok" class="yellow-themed">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://x.com/DangoCubed" target="_blank" rel="noopener noreferrer" data-i18n-title="social_x" class="red-themed">
          <i class="fab fa-x-twitter"></i>
        </a>
        <a href="https://www.facebook.com/DangoCubed" target="_blank" rel="noopener noreferrer" data-i18n-title="social_facebook" class="blue-themed">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.twitch.tv/dangocubed" target="_blank" rel="noopener noreferrer" data-i18n-title="social_twitch" class="red-themed">
          <i class="fab fa-twitch"></i>
        </a>
        <a href="https://discord.dango-cubed.com" target="_blank" rel="noopener noreferrer" data-i18n-title="social_discord" class="yellow-themed">
          <i class="fab fa-discord"></i>
        </a>
        </div>
        <!-- Intro -->
        <div class="intro-section">
          <p>
            <span data-i18n="intro_greeting"></span>
            <br>
            <span data-i18n="intro_social_prompt"></span>
            <a class="intro-hashtag" href="https://x.com/hashtag/DangoCubed" target="_blank" rel="noopener noreferrer" data-i18n="intro_hashtag"></a>
          </p>
        </div>
      </div>
      <div class="cards-grid">
        <!-- Video Embed Card-->
        <div class="card">
          <span class="card-title red-themed" data-i18n="video_card_title"></span>
          <div class="card-wrapper red-themed">
            <iframe
              src="https://www.youtube-nocookie.com/embed/a3EsqbDsl5A"
              title=""
              data-i18n-title="video_iframe_title"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
              frameborder="0"
            ></iframe>
          </div>
        </div>
        <!-- Member Card -->
        <div class="card">
          <span class="card-title blue-themed" data-i18n="member_card_title"></span>
          <div class="card-wrapper member-wrapper blue-themed">
            <!-- Omu -->
            <button class="member" type="button" aria-haspopup="dialog" aria-controls="member-lightbox" data-member-template="member-omu-details">
              <img class="blue-themed" src="/images/member/omu-profile.webp" alt="" data-i18n-alt="member_omu_alt">
              <span class="blue-themed" data-i18n="member_omu_name"></span>
              <small class="member-description" data-i18n="member_omu_description"></small>
            </button>
            <!-- Momiji -->
            <button class="member" type="button" aria-haspopup="dialog" aria-controls="member-lightbox" data-member-template="member-momiji-details">
              <img class="red-themed" src="/images/member/momiji-profile.webp" alt="" data-i18n-alt="member_momiji_alt">
              <span class="red-themed" data-i18n="member_momiji_name"></span>
              <small class="member-description" data-i18n="member_momiji_description"></small>
            </button>
            <!-- SAL -->
            <button class="member" type="button" aria-haspopup="dialog" aria-controls="member-lightbox" data-member-template="member-sal-details">
              <img class="yellow-themed" src="/images/member/sal-profile.webp" alt="" data-i18n-alt="member_sal_alt">
              <span class="yellow-themed" data-i18n="member_sal_name"></span>
              <small class="member-description" data-i18n="member_sal_description"></small>
            </button>
          </div>
        </div>
        <!-- News Card -->
        <div class="card">
          <span class="card-title yellow-themed" data-i18n="news_card_title"></span>
          <div class="card-wrapper yellow-themed">
            <div class="loop-gallery" data-source="/data/news.json">
              <button type="button" class="loop-arrow loop-arrow-left" data-i18n-aria-label="news_previous"><span aria-hidden="true">&#10094;</span></button>
              <img class="loop-image is-active" alt="" data-i18n-alt="news_image_one_alt">
              <img class="loop-image" alt="" data-i18n-alt="news_image_two_alt">
              <button type="button" class="loop-arrow loop-arrow-right" data-i18n-aria-label="news_next"><span aria-hidden="true">&#10095;</span></button>
            </div>
          </div>
        </div>
        <!-- Contact Card -->
        <div class="card">
          <span class="card-title red-themed" data-i18n="contact_card_title"></span>
          <div class="card-wrapper contact-wrapper red-themed">
            <form class="contact-form" id="contact-form">
              <div class="contact-field contact-subject">
                <label for="contact-subject" data-i18n="contact_subject_label"></label>
                <input id="contact-subject" name="subject" type="text" maxlength="150" placeholder="" data-i18n-placeholder="contact_subject_placeholder" required>
              </div>
              <div class="contact-field contact-message-field">
                <label for="contact-content" data-i18n="contact_message_label"></label>
                <textarea id="contact-content" name="content" maxlength="3000" placeholder="" data-i18n-placeholder="contact_message_placeholder" required></textarea>
              </div>
              <button class="contact-send" type="submit" data-i18n="contact_send"></button>
              <p class="contact-note" data-i18n="contact_note"></p>
            </form>
          </div>
        </div>
      </div>
      <button class="back-to-top-button" type="button">
        <svg viewBox="0 0 64 32" aria-hidden="true" focusable="false">
          <path d="M8 26 32 6l24 20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span data-i18n="back_to_top"></span>
      </button>
      <footer>
        <span>
          Site made by
          <a href="https://nicotine.buzz" target="_blank" rel="noopener noreferrer">salmoooon</a>.
          <br>
          Generative AI was used only to help code this site.
          <br>
          © 2026 Dango Cubed
        </span>
      </footer>
    </div>
    <template id="member-omu-details">
      <div class="member-lightbox-layout">
        <div class="member-lightbox-info">
          <section>
            <h3 data-i18n="member_omu_full_name"></h3>
            <p data-i18n="member_omu_title"></p>
          </section>
          <section>
            <p data-i18n="member_omu_intro"></p>
          </section>
          <section>
            <p data-i18n="member_omu_details"></p>
          </section>
          <div class="social-icons member-lightbox-social-icons">
            <a href="https://omurice-kun.com" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_link_site" class="yellow-themed">
              <i class="fa-solid fa-link" aria-hidden="true"></i>
            </a>
            <a href="https://x.com/yoyo091600" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_x" class="red-themed">
              <i class="fab fa-x-twitter" aria-hidden="true"></i>
            </a>
            <a href="https://discord.omurice-kun.com/" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_discord" class="blue-themed">
              <i class="fab fa-discord" aria-hidden="true"></i>
            </a>
          </div>
          <img class="member-lightbox-small-image" src="/images/member/omu-small.webp" alt="">
        </div>
        <img class="member-lightbox-image" src="/images/member/omu-full-body.webp" alt="" data-i18n-alt="member_omu_full_body_alt">
      </div>
    </template>
    <template id="member-momiji-details">
      <div class="member-lightbox-layout">
        <div class="member-lightbox-info">
          <section>
            <h3 data-i18n="member_momiji_full_name"></h3>
            <p data-i18n="member_momiji_title"></p>
          </section>
          <section>
            <p data-i18n="member_momiji_intro"></p>
          </section>
          <section>
            <p data-i18n="member_momiji_details"></p>
          </section>
          <div class="social-icons member-lightbox-social-icons">
            <a href="https://lit.link/Kumanomomiji" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_link_site" class="yellow-themed">
              <i class="fa-solid fa-link" aria-hidden="true"></i>
            </a>
            <a href="https://www.youtube.com/@Kumano_momiji" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_youtube" class="red-themed">
              <i class="fab fa-youtube" aria-hidden="true"></i>
            </a>
            <a href="https://www.twitch.tv/momiji_thebear" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_twitch" class="blue-themed">
              <i class="fab fa-twitch" aria-hidden="true"></i>
            </a>
          </div>
          <img class="member-lightbox-small-image" src="/images/member/momiji-small.webp" alt="">

      </div>

      <div class="member-lightbox-layout">
        <div class="member-lightbox-info">
          <section>
            <h3 data-i18n="member_sal_full_name"></h3>
            <p data-i18n="member_sal_title"></p>
          </section>
          <section>
            <p data-i18n="member_sal_intro"></p>
          </section>
          <section>
            <p data-i18n="member_sal_details"></p>
          </section>
          <div class="social-icons member-lightbox-social-icons">
            <a href="https://nicotine.buzz" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_website" class="yellow-themed">
              <i class="fa-solid fa-globe" aria-hidden="true"></i>
            </a>
            <a href="https://discordapp.com/users/102067807251869696" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_discord" class="blue-themed">
              <i class="fab fa-discord" aria-hidden="true"></i>
            </a>
            <a href="mailto:salmoooon@nicotine.buzz" target="_blank" rel="noopener noreferrer" title="" data-i18n-title="social_email" class="red-themed">
              <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            </a>
          </div>
          <img class="member-lightbox-small-image" src="/images/member/sal-small.webp" alt="">
        </div>
        <img class="member-lightbox-image" src="/images/member/sal-full-body.webp" alt="" data-i18n-alt="member_sal_full_body_alt">
      </div>
    </template>
    <template id="member-lightbox-card">
      <div class="member-lightbox-window">
        <button class="member-lightbox-close" type="button" data-i18n-aria-label="member_lightbox_close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </template>
    <dialog class="member-lightbox" id="member-lightbox" aria-label="" data-i18n-aria-label="member_lightbox_label"></dialog>

    <script src="/translations/tw.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
